services:
  MySqlAccountsServer:
    image: mysql:8.0
    container_name: mysqlAccounts
    ports:
      - "3307:3306"
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot" ]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      MYSQL_ROOT_PASSWORD: "root"
      MYSQL_DATABASE: "accounts_db"
    networks:
      - "easy-bank"
  rabbit:
    image: rabbitmq:4.1-management
    container_name: "rabbitMq"
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: rabbitmq-diagnostics check_port_connectivity
      retries: 10
      interval: 10s
      timeout: 5s
      start_period: 5s
    networks:
      - "easy-bank"


  config-server:
    image: "pavankalyan0499/configserver:0.0.1-SNAPSHOT"
    container_name: "config-server"
    ports:
      - "9011:8011"
    depends_on:
      rabbit:
        condition: service_healthy
    healthcheck:
      test: "curl --fail --silent localhost:8011/actuator/health/readiness | grep UP || exit1"
      retries: 10
      interval: 10s
      timeout: 5s
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: "700m"
    environment:
#      SPRING_CLOUD_CONFIG_SERVER_GIT_URI: "https://github.com/PavanKalyanMajji/env-config-files.git"
      SPRING_RABBITMQ_HOST: rabbit
    networks:
      - "easy-bank"

  eurekaServer:
    image: "pavankalyan0499/eurekaserver:0.0.1-SNAPSHOT"
    container_name: "eureka-server"
    ports:
      - "9070:8070"
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: "curl --fail --silent localhost:8070/actuator/health/readiness | grep UP || exit1"
      retries: 10
      interval: 10s
      timeout: 5s
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: "700m"
    environment:
      SPRING_APPLICATION_NAME: eureka-server
      SPRING_CONFIG_IMPORT: "configserver:http://config-server:8011/"
      EUREKA_CLIENT_FETCH-REGISTRY: false
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: false
      EUREKA_CLIENT_SERVICE-URL_DEFAULT-ZONE: "http://eurekaServer:8070/eureka"
    networks:
      - "easy-bank"

  accounts:
    image: "pavankalyan0499/accounts:0.0.1-SNAPSHOT"
    container_name: "accounts"
    ports:
      - "9012:8012"
    depends_on:
      eurekaServer:
        condition: service_healthy
      config-server:
        condition: service_healthy
      MySqlAccountsServer:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: "700m"
    environment:
      SPRING_APPLICATION_NAME: "accounts-service"
      SPRING_PROFILES_ACTIVE: "dev"
      SPRING_RABBITMQ_HOST: rabbit
      SPRING_CONFIG_IMPORT: "configserver:http://config-server:8011/"
      SPRING_DATASOURCE_URL: "jdbc:mysql://MySqlAccountsServer:3306/accounts_db"
      SPRING_DATASOURCE_USERNAME: "root"
      SPRING_DATASOURCE_PASSWORD: "root"
      SPRING_JPA_HIBERNATE_DDL-AUTO: "update"
      SPRING_CLOUD_FUNCTION_WEB_PATH: "/base-endpoint"
      EUREKA_CLIENT_FETCH-REGISTRY: true
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: true
      EUREKA_CLIENT_SERVICE-URL_DEFAULT-ZONE: "http://eurekaServer:8070/eureka"
    networks:
      - "easy-bank"

  loans:
    image: "pavankalyan0499/loans:0.0.1-SNAPSHOT"
    container_name: "loans"
    ports:
      - "9013:8013"
    depends_on:
      eurekaServer:
        condition: service_healthy
      MySqlAccountsServer:
        condition: service_healthy
      config-server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: "700m"
    environment:
      SPRING_APPLICATION_NAME: "loans-service"
      SPRING_PROFILES_ACTIVE: "dev"
      SPRING_RABBITMQ_HOST: rabbit
      SPRING_CONFIG_IMPORT: "configserver:http://config-server:8011/"
      SPRING_DATASOURCE_URL: "jdbc:mysql://MySqlAccountsServer:3306/accounts_db"
      SPRING_DATASOURCE_USERNAME: "root"
      SPRING_DATASOURCE_PASSWORD: "root"
      SPRING_JPA_HIBERNATE_DDL-AUTO: "update"
      EUREKA_CLIENT_FETCH-REGISTRY: true
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: true
      EUREKA_CLIENT_SERVICE-URL_DEFAULT-ZONE: "http://eurekaServer:8070/eureka"
    networks:
      - "easy-bank"
networks:
  easy-bank:
    driver: "bridge"