server:
  port: "8012"

account:
  service:
    version: "v1"
    name: "accounts-service"
    env: "default"
    configLoadedFrom: "default"

spring:
  application:
    name: "accounts-service"
  profiles:
    active: "prod"
  datasource:
    url: "jdbc:mysql://localhost:3306/accountsdb"
    username: "root"
    password: "root"
  jpa:
    hibernate:
      ddlAuto: "update"
    showSql: "true"

#    Cloud Config
  config:
    import: "optional:configserver:http://localhost:8011/" #Property file will load from the Config Server Service

#      RabbitMQ Config
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  cloud:
    function:
      web:
        path: /base-endpoint

eureka:
  instance:
    preferIpAddress: "true"
  client:
    fetchRegistry: "true"
    registerWithEureka: "true"
    serviceUrl:
      defaultZone: "http://localhost:8070/eureka"

#Management config
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    shutdown:
      access: "unrestricted"
  info:
    build:
      enabled: "true"
    git:
      enabled: "true"
    java:
      enabled: "true"
    os:
      enabled: "true"

info:
  app:
    name: "Accounts-Service"
    description: "To maintain easy-bank accounts By using accounts microservice"
    version: "1.0"